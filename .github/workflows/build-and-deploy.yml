name: Build database & publish dashboard

# Rebuilds the relational database, knowledge graph, statistics, figures and
# interactive dashboard on every push to main, then publishes docs/index.html
# to GitHub Pages. The build is deterministic: every table's row count is
# asserted against the source workbook's own summary counts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproducible build (parse -> db -> graph -> stats -> figures -> dashboard)
        run: python run_all.py

      - name: Sanity-check build outputs
        run: |
          test -f data/db/fungal_bgc_atlas.db
          test -f docs/index.html
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("data/db/fungal_bgc_atlas.db")
          n = con.execute("SELECT COUNT(*) FROM BGC").fetchone()[0]
          assert n == 609, f"expected 609 BGC dossiers, got {n}"
          print(f"OK: {n} BGC dossiers in database")
          PY

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp -r docs/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
